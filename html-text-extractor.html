<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="description" content="HTML 코드를 붙여넣고 태그와 불필요한 공백을 정리해 텍스트로 변환하세요.">
  <title>HTML 텍스트 추출기</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      color: #172033;
      background: #f5f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --muted: #68738a;
      --line: #dce2ec;
      --accent: #5368e8;
      --accent-dark: #4053cb;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 56px 20px;
      background:
        radial-gradient(ellipse at 50% 0, #e8edff 0, transparent 44rem),
        #f5f7fb;
    }

    main {
      width: min(100%, 980px);
      margin: 0 auto;
    }

    .intro { margin-bottom: 28px; }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 40px);
      letter-spacing: -.045em;
    }

    .description {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .workspace {
      padding: 24px;
      border: 1px solid #e4e8f0;
      border-radius: 20px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 18px 55px rgba(34, 47, 83, .08);
    }

    .field + .field { margin-top: 23px; }
    .actions + .field { margin-top: 32px; }

    .field-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    label {
      font-size: 14px;
      font-weight: 750;
    }

    .hint, .count {
      color: var(--muted);
      font-size: 12px;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 210px;
      resize: vertical;
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      background: #fbfcfe;
      color: #202b40;
      font: 13px/1.65 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      transition: border-color .15s, box-shadow .15s;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(83, 104, 232, .13);
    }

    #output {
      min-height: 180px;
      background: #fff;
      font-family: inherit;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: #344057;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .15s;
    }

    button:hover { background: #f4f6fb; border-color: #c5cede; }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid rgba(83, 104, 232, .25); outline-offset: 2px; }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    button.primary:hover { border-color: var(--accent-dark); background: var(--accent-dark); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .spacer { flex: 1; }

    .status {
      min-height: 20px;
      margin: 16px 2px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .status.error { color: #bd3443; }

    .privacy {
      margin: 16px 4px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    @media (max-width: 600px) {
      body { padding: 34px 14px; }
      .workspace { padding: 17px; border-radius: 15px; }
      textarea { min-height: 180px; }
      .actions button { flex: 1 1 auto; }
      .spacer { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <header class="intro">
      <p class="eyebrow">QUICK TEXT TOOL</p>
      <h1>HTML 텍스트 추출기</h1>
      <p class="description">HTML 원본을 붙여넣고 버튼을 누르면 태그를 제거해 읽기 쉬운 텍스트로 바꿉니다.</p>
    </header>

    <section class="workspace" aria-label="HTML 텍스트 변환">
      <div class="field">
        <div class="field-heading">
          <label for="source">HTML 원본</label>
          <span class="hint">HTML 코드를 여기에 붙여넣으세요</span>
        </div>
        <textarea id="source" spellcheck="false" placeholder="예: &lt;p&gt;안녕하세요.&lt;/p&gt;&#10;&lt;p&gt;반갑습니다.&amp;nbsp;환영합니다!&lt;/p&gt;"></textarea>
      </div>

      <div class="actions">
        <button class="primary" id="convert" type="button">텍스트 추출</button>
        <button id="clear" type="button">초기화</button>
      </div>

      <div class="field">
        <div class="field-heading">
          <label for="output">변환 결과</label>
          <span class="count" id="character-count">0자</span>
        </div>
        <textarea id="output" readonly aria-live="polite" placeholder="변환된 텍스트가 여기에 표시됩니다."></textarea>
      </div>

      <div class="actions">
        <button class="primary" id="copy" type="button" disabled>결과 복사</button>
        <span class="spacer"></span>
        <span class="hint">문단과 줄바꿈은 유지하고 &amp;nbsp;는 공백으로 바꿉니다.</span>
      </div>
      <p class="status" id="status" role="status" aria-live="polite">HTML을 입력하고 ‘텍스트 추출’을 눌러 주세요.</p>
    </section>

    <p class="privacy">입력한 내용은 이 브라우저에서만 처리되며 어디에도 전송되지 않습니다.</p>
  </main>

  <script>
    const source = document.querySelector("#source");
    const output = document.querySelector("#output");
    const characterCount = document.querySelector("#character-count");
    const status = document.querySelector("#status");
    const copyButton = document.querySelector("#copy");
    const blockTags = new Set([
      "ADDRESS", "ARTICLE", "ASIDE", "BLOCKQUOTE", "DD", "DIV", "DL", "DT",
      "FIELDSET", "FIGCAPTION", "FIGURE", "FOOTER", "FORM", "H1", "H2", "H3",
      "H4", "H5", "H6", "HEADER", "HR", "LI", "MAIN", "NAV", "OL", "P",
      "PRE", "SECTION", "TABLE", "UL"
    ]);

    function htmlToText(html) {
      const template = document.createElement("template");
      template.innerHTML = html;
      template.content.querySelectorAll("script, style, template, noscript").forEach((node) => node.remove());

      function readNode(node) {
        if (node.nodeType === Node.TEXT_NODE) return node.nodeValue || "";
        if (node.nodeType !== Node.ELEMENT_NODE && node.nodeType !== Node.DOCUMENT_FRAGMENT_NODE) return "";

        const element = node;
        const tag = element.tagName;
        if (!tag) return Array.from(element.childNodes, readNode).join("");
        if (tag === "BR") return "\n";

        const content = Array.from(element.childNodes, readNode).join("");
        if (tag === "TD" || tag === "TH") return content + "\t";
        if (tag === "TR" || blockTags.has(tag)) return content + "\n";
        return content;
      }

      return readNode(template.content)
        .replace(/\u00a0/g, " ")
        .replace(/[\t \f\v]*\n[\t \f\v]*/g, "\n")
        .replace(/[\t \f\v]+/g, " ")
        .replace(/\n{2,}/g, "\n")
        .trim();
    }

    function updateOutput(text) {
      output.value = text;
      characterCount.textContent = `${text.length.toLocaleString("ko-KR")}자`;
      copyButton.disabled = text.length === 0;
    }

    document.querySelector("#convert").addEventListener("click", () => {
      status.textContent = "";
      status.classList.remove("error");

      if (!source.value.trim()) {
        updateOutput("");
        status.textContent = "먼저 HTML 원본을 입력해 주세요.";
        status.classList.add("error");
        source.focus();
        return;
      }

      updateOutput(htmlToText(source.value));
      status.textContent = "텍스트 추출이 완료되었습니다.";
    });

    document.querySelector("#clear").addEventListener("click", () => {
      source.value = "";
      updateOutput("");
      status.textContent = "HTML을 입력하고 ‘텍스트 추출’을 눌러 주세요.";
      status.classList.remove("error");
      source.focus();
    });

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(output.value);
        status.textContent = "변환 결과를 클립보드에 복사했습니다.";
        status.classList.remove("error");
      } catch (error) {
        status.textContent = "복사하지 못했습니다. 결과를 선택해 직접 복사해 주세요.";
        status.classList.add("error");
      }
    });
  </script>
</body>
</html>
