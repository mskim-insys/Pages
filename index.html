<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="description" content="HTML 텍스트 추출기를 실행할 수 있는 도구 페이지입니다.">
  <title>웹 도구</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      color: #172033;
      background: #f5f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --muted: #68738a;
      --accent: #5368e8;
      --accent-dark: #4053cb;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
      background:
        radial-gradient(ellipse at 50% 0, #e8edff 0, transparent 44rem),
        #f5f7fb;
    }

    main {
      width: min(100%, 620px);
      padding: clamp(28px, 7vw, 56px);
      border: 1px solid #e4e8f0;
      border-radius: 24px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 18px 55px rgba(34, 47, 83, .08);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 6vw, 42px);
      letter-spacing: -.045em;
    }

    .description {
      margin: 16px 0 28px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .tool-link {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 0 22px;
      border: 1px solid var(--accent);
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 750;
      text-decoration: none;
      transition: background .15s, border-color .15s, transform .15s;
    }

    .tool-link:hover {
      border-color: var(--accent-dark);
      background: var(--accent-dark);
    }

    .tool-link:active { transform: translateY(1px); }
    .tool-link:focus-visible { outline: 3px solid rgba(83, 104, 232, .25); outline-offset: 3px; }

    @media (max-width: 480px) {
      body { padding: 16px; }
      main { border-radius: 18px; }
      .tool-link { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">QUICK TEXT TOOL</p>
    <h1>웹 도구</h1>
    <p class="description">HTML 코드에서 태그를 제거하고 읽기 쉬운 텍스트로 변환해 보세요.</p>
    <a class="tool-link" href="./html-text-extractor.html">HTML 텍스트 추출기 열기</a>
  </main>
</body>
</html>
